<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/cityshield/brand/logo-mark-96.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Theme colour is per colour-scheme: a light chrome bar over a dark app
         (or the reverse) is the tell that a PWA was never actually installed
         and tested. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f6fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1b33" />
    <!-- The page title and meta description are owned per route by the Seo
         component, so every page gets its own. They are deliberately absent
         here: duplicating them would emit two of each element, which is invalid,
         and a crawler taking the first would read the same generic copy on every
         page. -->
    <link rel="manifest" href="/cityshield/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/cityshield/brand/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="City Shield" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      /* Apply the stored palette/theme BEFORE first paint. Two reasons:
         1. No flash of the wrong theme on load.
         2. React runs child effects before parent effects, so a page that
            measures resolved tokens on mount would otherwise read the
            defaults rather than the user's choice. */
      (function () {
        try {
          var d = document.documentElement;
          d.setAttribute('data-palette', localStorage.getItem('cs.palette') || 'civic');
          d.setAttribute('data-theme', localStorage.getItem('cs.theme') || 'light');
          d.style.colorScheme = d.getAttribute('data-theme');
        } catch (e) {
          document.documentElement.setAttribute('data-palette', 'civic');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <script type="module" crossorigin src="/cityshield/assets/index-C2sZ0y8w.js"></script>
    <link rel="modulepreload" crossorigin href="/cityshield/assets/Seo-D945-xsU.js">
    <link rel="stylesheet" crossorigin href="/cityshield/assets/index-CkRphto0.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
