    <script>
      /* Apply the stored palette/theme BEFORE first paint. Two reasons:
         1. No flash of the wrong theme on load.
         2. React runs child effects before parent effects, so a page that
            measures resolved tokens on mount would otherwise read the
            defaults rather than the user's choice. */
      (function () {
        try {
          var d = document.documentElement;
          d.setAttribute('data-palette', localStorage.getItem('cs.palette') || 'civic');
          d.setAttribute('data-theme', localStorage.getItem('cs.theme') || 'light');
          d.style.colorScheme = d.getAttribute('data-theme');
        } catch (e) {
          document.documentElement.setAttribute('data-palette', 'civic');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
